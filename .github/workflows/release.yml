name: Release

# Push a tag such as v0.1.0. The tag must match <Version> in Directory.Build.props and
# CHANGELOG.md must have a dated "## [0.1.0] - YYYY-MM-DD" section.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check version and extract release notes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $props = [xml](Get-Content Directory.Build.props -Raw)
          $projectVersion = ($props.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($projectVersion -ne $version) { throw "Tag v$version does not match Directory.Build.props Version $projectVersion." }
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## \[' + [regex]::Escape($version) + '\][^\r\n]*\r?\n(.*?)(?=^## \[|^\[[^\]]+\]:|\z)'
          $heading = [regex]::Match($changelog, '(?m)^## \[' + [regex]::Escape($version) + '\][^\r\n]*').Value
          if (-not $heading) { throw "CHANGELOG.md has no section for $version." }
          if ($heading -match 'Unreleased') { throw "CHANGELOG.md section for $version is still marked Unreleased; set the release date." }
          $notes = [regex]::Match($changelog, $pattern).Groups[1].Value.Trim()
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Set-Content -Path artifacts/release-notes.md -Value $notes -Encoding utf8
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and test
        shell: pwsh
        run: ./Verify.ps1

      - name: Pack and package smoke test
        shell: pwsh
        run: ./Pack-And-Smoke.ps1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Pangaea Dock ${{ env.VERSION }}
          body_path: artifacts/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
